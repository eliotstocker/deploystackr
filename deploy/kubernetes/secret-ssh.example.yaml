# Example SSH Deploy Key Secret for GitOps repository authentication
# Create with kubectl:
#   kubectl create secret generic deploystackr-ssh-key \
#     --namespace=deploystackr \
#     --from-file=id_rsa=~/.ssh/id_rsa
#
apiVersion: v1
kind: Secret
metadata:
  name: deploystackr-ssh-key
  namespace: deploystackr
type: Opaque
stringData:
  # Accepts id_rsa, id_ed25519, id_ecdsa, or ssh-privatekey
  id_rsa: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    ...YOUR_PRIVATE_KEY_HERE...
    -----END OPENSSH PRIVATE KEY-----
