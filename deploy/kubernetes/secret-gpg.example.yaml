# Example GPG Signing Key Secret for signed GitOps promotion commits
# Create with kubectl:
#   kubectl create secret generic deploystackr-gpg-key \
#     --namespace=deploystackr \
#     --from-file=signing.key=/path/to/private.key
#
apiVersion: v1
kind: Secret
metadata:
  name: deploystackr-gpg-key
  namespace: deploystackr
type: Opaque
stringData:
  signing.key: |
    -----BEGIN PGP PRIVATE KEY BLOCK-----
    ...YOUR_GPG_PRIVATE_KEY_HERE...
    -----END PGP PRIVATE KEY BLOCK-----
