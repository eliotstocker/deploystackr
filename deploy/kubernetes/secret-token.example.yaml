# Example GitHub / Forge Token Secret for HTTPS git auth and Pull Request creation
# Create with kubectl:
#   kubectl create secret generic deploystackr-github-token \
#     --namespace=deploystackr \
#     --from-literal=token=ghp_yourPersonalAccessToken
#
apiVersion: v1
kind: Secret
metadata:
  name: deploystackr-github-token
  namespace: deploystackr
type: Opaque
stringData:
  token: "ghp_yourPersonalAccessTokenHere"
